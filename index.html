<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS AI</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #050816;
      color: #00f5ff;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nexus {
      text-align: center;
      padding: 40px;
    }

    h1 {
      font-size: 52px;
      letter-spacing: 8px;
      margin: 0 0 15px;
      text-shadow: 0 0 25px #00f5ff;
    }

    p {
      color: #b8c7d9;
      font-size: 18px;
    }

    button {
      margin-top: 25px;
      padding: 14px 30px;
      border: 1px solid #00f5ff;
      border-radius: 10px;
      background: transparent;
      color: #00f5ff;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #00f5ff;
      color: #050816;
    }
  </style>
</head>
<body>
  <div class="nexus">
    <h1>NEXUS</h1>
    <p>Next-Generation Personal AI</p>
    <button onclick="openNexus()">INITIALIZE NEXUS</button>
  </div>

  <script>
    function openNexus() {
      alert("NEXUS AI initialized.");
    }
  </script>
</body>
</html>
